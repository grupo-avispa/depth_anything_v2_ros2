# Simple set of rules for GitHub actions integration with a ROS project
#

name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy

    steps:
      - name: Install global dependencies
        run: |
          apt update && apt install --no-install-recommends -y \
            git python3-pip python3-colcon-coveragepy-result
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Cache pip
        id: cache-pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip3 install --break-system-packages --ignore-installed -r requirements.txt
      - name: Build packages
        uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: depth_anything_v2_ros2
          target-ros2-distro: jazzy
          colcon-defaults: |
            {
              "build": {
                "mixin": ["coverage-gcc", "coverage-pytest"]
              },
              "test": {
                "mixin": ["coverage-pytest"]
              }
            }
          skip-tests: false
